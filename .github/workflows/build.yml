name: Build EXE & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write      # ← INI yang fix error "Resource not accessible"

jobs:
  build-windows:
    runs-on: windows-2022    # lebih stabil dari windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pygame==2.6.1 pyinstaller==6.11.1

      - name: Build EXE
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "EnglishBattlePets" `
            --add-data "assets;assets" `
            main.py

      - name: Verify EXE exists
        run: |
          dir dist\

      - name: Upload EXE as artifact (selalu tersimpan)
        uses: actions/upload-artifact@v4
        with:
          name: EnglishBattlePets-Windows
          path: dist/EnglishBattlePets.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "English Battle Pets ${{ github.ref_name }}"
          body: |
            ## English Battle Pets - Windows
            Download **EnglishBattlePets.exe** di bawah, double-klik langsung main.
            Jika ada warning Windows Defender: klik More info → Run anyway.
          files: dist/EnglishBattlePets.exe
