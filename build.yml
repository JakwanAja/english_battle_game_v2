name: Build EXE & Release

on:
  push:
    tags:
      - 'v*'          # trigger saat push tag seperti v1.0, v1.1, dll
  workflow_dispatch:  # bisa trigger manual dari GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pygame pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "EnglishBattlePets" `
            --add-data "assets;assets" `
            main.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishBattlePets-Windows
          path: dist/EnglishBattlePets.exe

      - name: Create GitHub Release & upload EXE
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "English Battle Pets ${{ github.ref_name }}"
          body: |
            ## English Battle Pets - Windows Build
            
            **Download:** Klik `EnglishBattlePets.exe` di bawah
            
            **Cara main:**
            - Download file .exe
            - Double-klik langsung — tidak perlu install Python
            - Jika Windows Defender warning: klik "More info" → "Run anyway"
          files: dist/EnglishBattlePets.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
